# What this workflow asks of the PERD platform. Read by the build; the class
# is fixed per version and shown (never chosen) at launch.
[compute]
class = "gpu_t4"    # 4 vCPU / 16 GiB + 1x NVIDIA T4; the gold preset trains here

# Store metadata, shown on the workflow's page and in the store.
[workflow]
summary  = "Δ-PINN reservoir training: a deck in, a live 3-D training view out, on a single T4."
tags     = ["pinn", "reservoir", "laplace", "gpu", "simulation"]
category = "Reservoir"
license  = "MIT"
