# What this workflow asks of the PERD platform. Read by the build; the class
# is fixed per version and shown (never chosen) at launch.
[compute]
class = "gpu_t4"    # 4 vCPU / 16 GiB + 1x NVIDIA T4: the three work paths train here

[workflow]
summary = "Build a reservoir model, hand it to OPM Flow, and history-match, forecast or invert it with a physics-informed network."
tags = ["reservoir", "history-matching", "forecasting", "inversion", "pinn", "eclipse"]
category = "Reservoir"
license = "MIT"
homepage = "https://github.com/Mechtanium/gNN"
